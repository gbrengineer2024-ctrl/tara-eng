name: Sync Engineering UI

on:
  push:
    paths:
      - '.github/workflows/tara-ui-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix API endpoint and registration defaults
        shell: python3 {0}
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_api = 'https://script.google.com/macros/s/AKfycbyRYWVrJbZpSzMMQQZB7OhjWHa9LW6_KVtI6sZS4ScvuEQ1TPPePR1zly77eDQQfl6q/exec'
          new_api = 'https://script.google.com/macros/s/AKfycbx44qabDtmTJrsQERQ7m3yaxS_q_LyaZnZpcsoIw6R98VO_atIliCWo9puONR-7Ip7I/exec'
          s = s.replace(old_api, new_api)

          marker = "const defaultDepartments = ["
          if marker not in s:
              anchor = "const LIFF_ID = '2010924055-ptu13GAx';"
              departments = '''\n\nconst defaultDepartments = [\n  'ENGINEERING',\n  'HOUSEKEEPING',\n  'FRONT OFFICE',\n  'FOOD & BEVERAGE',\n  'KITCHEN',\n  'SECURITY',\n  'HUMAN RESOURCES',\n  'ACCOUNTING',\n  'SALES & MARKETING',\n  'PURCHASING',\n  'BANQUET',\n  'SPA',\n  'OTHER'\n];\n'''
              s = s.replace(anchor, anchor + departments, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit frontend fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No frontend changes needed'
            exit 0
          fi
          git commit -m 'fix: frontend API endpoint and registration'
          git push
