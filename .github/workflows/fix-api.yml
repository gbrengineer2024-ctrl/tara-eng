name: Fix API action mismatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-api.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix frontend API action
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "await runServer(\n      'getUser',"
          new = "await runServer(\n      'checkUserAuth',"
          if old not in s:
              print('Target already fixed or not found')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit frontend fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix LIFF auth action to match Apps Script backend'
          git push
