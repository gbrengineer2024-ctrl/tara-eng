name: Patch current index.html

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="https://script.google.com/macros/s/AKfycbxf7tBZ82ypqt-lqzh0JP-tcMtNBn-gE0g6iDZjGs2PRJPoERTZOXu71vcSQIbGYDg/exec"
          new="https://script.google.com/macros/s/AKfycbx44qabDtmTJrsQERQ7m3yaxS_q_LyaZnZpcsoIw6R98VO_atIliCWo9puONR-7Ip7I/exec"
          s=s.replace(old,new)
          marker="function ticketActionButtons(t){"
          start=s.index(marker)
          end=s.index("\n\n\n/* =========================================================\n   VIEW TICKET", start)
          newfunc=r'''function ticketActionButtons(t){
  const s=String(t.status||'').toUpperCase();
  const role=String(currentUser?.role||'').toUpperCase();
  const buttons=[];
  const no=escAttr(t.ticket_no||'');
  const canManage=(role==='ADMIN'||role==='SUPERVISOR'||isAdmin());
  const canEdit=canManage || String(t.reporter_user_id||t.line_user_id||'')===String(currentUser?.userId||'');
  if(canEdit && s!=='COMPLETED' && s!=='CANCELLED') buttons.push(`<button class="btn-secondary" onclick="openEditTicket('${no}')">✏️ Edit</button>`);
  if(canManage && s!=='COMPLETED' && s!=='CANCELLED') buttons.push(`<button class="btn-purple" onclick="openAssignTicket('${no}')">👷 Assign</button>`);
  if(s!=='COMPLETED' && s!=='CANCELLED' && (canManage || hasPermission('CANCEL_TICKET'))) buttons.push(`<button class="btn-danger" onclick="cancelTicketUI('${no}')">❌ Cancel</button>`);
  if(s==='NEW' && hasPermission('CHANGE_STATUS')) buttons.push(`<button class="btn-blue" onclick="changeTicketStatus('${no}','ASSIGNED')">▶ มอบหมายงาน</button>`);
  if(s==='ASSIGNED' && hasPermission('CHANGE_STATUS')) buttons.push(`<button class="btn-blue" onclick="changeTicketStatus('${no}','IN_PROGRESS')">▶ เริ่มงาน</button>`);
  if(s==='IN_PROGRESS' && hasPermission('CHANGE_STATUS')) buttons.push(`<button class="btn-purple" onclick="changeTicketStatus('${no}','WAITING_PARTS')">📦 รออะไหล่</button>`);
  if(s==='WAITING_PARTS' && hasPermission('CHANGE_STATUS')) buttons.push(`<button class="btn-blue" onclick="changeTicketStatus('${no}','IN_PROGRESS')">▶ ทำงานต่อ</button>`);
  if((s==='IN_PROGRESS'||s==='WAITING_PARTS') && hasPermission('STOCK_OUT')) buttons.push(`<button class="btn-warning" onclick="openStockMove('OUT','${no}')">📤 เบิกของ</button>`);
  if(s==='IN_PROGRESS' && hasPermission('CLOSE_TICKET')) buttons.push(`<button class="btn-success" onclick="completeTicket('${no}')">✓ เสร็จงาน</button>`);
  if(hasPermission('PRINT_PENDING_PARTS_PDF')) buttons.push(s==='WAITING_PARTS'?`<button class="btn-purple" onclick="createPendingPartsPDFUI('${no}')">📄 PDF ใบเบิกอะไหล่</button>`:`<button class="btn-purple" onclick="createTicketPDFUI('${no}')">📄 PDF</button>`);
  return buttons.join('');
}

async function openEditTicket(no){
  const t=(systemData.tickets||[]).find(x=>String(x.ticket_no)===String(no))||(systemData.departmentTickets||[]).find(x=>String(x.ticket_no)===String(no));
  if(!t)return;
  document.getElementById('modalTitle').textContent='✏️ Edit งาน #'+no;
  document.getElementById('modalBody').innerHTML=`<div class="form-group"><label>สถานที่ / เลขห้อง</label><input id="editLocation" value="${escAttr(t.location||'')}"></div><div class="form-group"><label>หมวดหมู่</label><select id="editCategory"><option value="ELECTRICAL">ไฟฟ้า / แสงสว่าง</option><option value="PLUMBING">ประปา / สุขภัณฑ์</option><option value="HVAC">ระบบปรับอากาศ</option><option value="FURNITURE">เฟอร์นิเจอร์ / อาคาร</option><option value="OTHER">อื่น ๆ</option></select></div><div class="form-group"><label>ความด่วน</label><select id="editPriority"><option value="NORMAL">ปกติ</option><option value="HIGH">สูง</option><option value="URGENT">ด่วนมาก</option></select></div><div class="form-group"><label>รายละเอียด</label><textarea id="editIssue">${esc(t.issue||'')}</textarea></div><button class="btn-primary" onclick="saveEditedTicket('${escAttr(no)}')">💾 บันทึกการแก้ไข</button>`;
  document.getElementById('editCategory').value=t.category||'OTHER';
  document.getElementById('editPriority').value=t.priority||'NORMAL';
  openModal();
}

async function saveEditedTicket(no){
  try{const r=await runServer('editTicket',{line_user_id:currentUser.userId,ticketNo:no,location:document.getElementById('editLocation').value.trim(),category:document.getElementById('editCategory').value,priority:document.getElementById('editPriority').value,issue:document.getElementById('editIssue').value.trim()});if(r.status!=='success')throw new Error(r.message||'แก้ไขงานไม่สำเร็จ');closeModal();toast('แก้ไขงานสำเร็จ','success');await loadInitialData();showView('taskSection');renderTaskList();}catch(e){toast(e.message,'error');}
}

async function openAssignTicket(no){
  const staff=(systemData.staff||[]).filter(x=>String(x.role||'').toUpperCase()==='TECHNICIAN'&&String(x.status||'ACTIVE').toUpperCase()!=='INACTIVE');
  if(!staff.length){toast('ไม่พบรายชื่อช่าง','warning');return;}
  document.getElementById('modalTitle').textContent='👷 Assign งาน #'+no;
  document.getElementById('modalBody').innerHTML=`<div class="form-group"><label>เลือกช่าง</label><select id="assignTechnician"><option value="">-- เลือกช่าง --</option>${staff.map(x=>`<option value="${escAttr(x.line_user_id||x.user_id||x.emp_id||'')}">${esc(x.full_name||x.displayName||x.name||x.emp_id||'-')}</option>`).join('')}</select></div><button class="btn-primary" onclick="saveAssignTicket('${escAttr(no)}')">🔗 Assign งานให้ช่าง</button>`;
  openModal();
}

async function saveAssignTicket(no){
  try{const technicianId=document.getElementById('assignTechnician').value;if(!technicianId)throw new Error('กรุณาเลือกช่าง');const r=await runServer('assignTicket',{line_user_id:currentUser.userId,ticketNo:no,technician_id:technicianId});if(r.status!=='success')throw new Error(r.message||'Assign งานไม่สำเร็จ');closeModal();toast('Assign งานให้ช่างแล้ว','success');await loadInitialData();showView('taskSection');renderTaskList();}catch(e){toast(e.message,'error');}
}

async function cancelTicketUI(no){
  if(!confirm('ยืนยันยกเลิกงาน #'+no+' ?'))return;
  try{const r=await runServer('cancelTicket',{line_user_id:currentUser.userId,ticketNo:no,reason:'ยกเลิกจากระบบ'});if(r.status!=='success')throw new Error(r.message||'ยกเลิกงานไม่สำเร็จ');toast('ยกเลิกงานแล้ว','success');await loadInitialData();showView('taskSection');renderTaskList();}catch(e){toast(e.message,'error');}
}'''
          s=s[:start]+newfunc+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix API URL and add Edit Cancel Assign actions'
          git push
