<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Maintenance System</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- 1. LOADING SCREEN (หน้ากำลังยืนยันตัวตน) -->
  <div id="loading-screen" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
    <p class="text-gray-600 text-sm font-medium">กำลังยืนยันตัวตนผ่าน LINE...</p>
  </div>

  <!-- 2. REGISTER SCREEN (หน้าลงทะเบียนสำหรับพนักงานใหม่) -->
  <div id="register-screen" class="hidden min-h-screen p-4 flex flex-col justify-center">
    <div class="bg-white p-6 rounded-xl shadow-md max-w-md mx-auto w-full">
      <h2 class="text-2xl font-bold text-center text-blue-600 mb-2">ลงทะเบียนใช้งาน</h2>
      <p class="text-xs text-gray-500 text-center mb-6">กรุณากรอกข้อมูลพนักงานเพื่อเข้าสู่ระบบ Maintenance</p>
      
      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
        <input type="hidden" id="reg-line-id">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">รหัสพนักงาน (emp_id)</label>
          <input type="text" id="reg-emp-id" required placeholder="เช่น EMP-001" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่อ-นามสกุล (full_name)</label>
          <input type="text" id="reg-full-name" required placeholder="เช่น สมชาย ใจดี" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">แผนก (department)</label>
          <select id="reg-dept" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- เลือกแผนก --</option>
            <option value="ENGINEERING">ENGINEERING (ช่างซ่อมบำรุง)</option>
            <option value="HOUSEKEEPING">HOUSEKEEPING (แม่บ้าน)</option>
            <option value="FRONT DESK">FRONT DESK (ต้อนรับ)</option>
            <option value="ADMIN">ADMIN / MANAGEMENT</option>
          </select>
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition duration-200">
          บันทึกข้อมูลลงทะเบียน
        </button>
      </form>
    </div>
  </div>

  <!-- 3. MAIN APP SCREEN (หน้าหลักเมื่อยืนยันตัวตนสำเร็จ) -->
  <div id="main-app" class="hidden min-h-screen p-4 max-w-md mx-auto pb-20">
    <!-- Header ข้อมูลผู้ใช้ -->
    <div class="bg-blue-600 text-white p-4 rounded-xl shadow-md mb-4 flex items-center space-x-3">
      <img id="user-picture" class="w-12 h-12 rounded-full border-2 border-white" src="https://via.placeholder.com/150" alt="Profile">
      <div>
        <h3 id="user-name" class="font-bold text-base">กำลังโหลด...</h3>
        <p class="text-xs opacity-90"><span id="user-dept">-</span> | <span id="user-role" class="font-semibold bg-blue-800 px-1.5 py-0.5 rounded">-</span></p>
        <p class="text-[10px] opacity-75 mt-0.5">ID: <span id="user-emp-id">-</span></p>
      </div>
    </div>

    <!-- เมนูตามสิทธิ์ -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button class="bg-white p-4 rounded-xl shadow hover:shadow-md border border-gray-100 flex flex-col items-center justify-center text-center">
        <span class="text-2xl mb-1">🔧</span>
        <span class="text-xs font-medium text-gray-700">แจ้งซ่อมด่วน</span>
      </button>

      <button class="bg-white p-4 rounded-xl shadow hover:shadow-md border border-gray-100 flex flex-col items-center justify-center text-center">
        <span class="text-2xl mb-1">📋</span>
        <span class="text-xs font-medium text-gray-700">ติดตามงานซ่อม</span>
      </button>

      <button class="bg-white p-4 rounded-xl shadow hover:shadow-md border border-gray-100 flex flex-col items-center justify-center text-center">
        <span class="text-2xl mb-1">⚡</span>
        <span class="text-xs font-medium text-gray-700">จดมิเตอร์น้ำ-ไฟ</span>
      </button>

      <button class="bg-white p-4 rounded-xl shadow hover:shadow-md border border-gray-100 flex flex-col items-center justify-center text-center">
        <span class="text-2xl mb-1">⏱️</span>
        <span class="text-xs font-medium text-gray-700">ลงเวลาเข้ากะ</span>
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // 🛑 1. ตั้งค่า LIFF ID และ GAS URL ให้ถูกต้อง
    const LIFF_ID = "2010924055-ptu13GAx"; // เช่น 1657000000-xxxxxxx
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxMD85veg-AkAx4T6_2xEbGsHRrTD2mtqJYVBXN0gzpqfXKDWlUcgTchJ3uf3_HDn6y/exec"; // URL จาก New Deployment ของ GAS

    let currentUser = null;

    document.addEventListener("DOMContentLoaded", function() {
      initLIFF();
    });

    // 2. เริ่มต้นระบบ LIFF
    async function initLIFF() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        document.getElementById("reg-line-id").value = profile.userId;

        // ตรวจสอบสิทธิ์กับ GAS ตามโครงสร้างชีต Users ใหม่
        await checkUserRegistration(profile);

      } catch (err) {
        console.error("LIFF Init Error:", err);
        showError("เกิดข้อผิดพลาดในการโหลด LIFF: " + err.message);
      }
    }

    // 3. ดึงข้อมูล User จาก GAS (ชีต Users)
    async function checkUserRegistration(profile) {
      try {
        const response = await fetch(`${GAS_WEBAPP_URL}?action=getUser&userId=${profile.userId}`);
        const result = await response.json();

        // ปิดหน้า Loading เสมอเมื่อได้ผลลัพธ์
        hideLoading();

        if (result.status === "success" && result.data && result.data.status === "ACTIVE") {
          // หากพบข้อมูลผู้ใช้ และสถานะเป็น ACTIVE -> แสดงหน้าหลัก
          currentUser = result.data;
          renderMainApp(profile, result.data);
        } else {
          // หากยังไม่เคยลงทะเบียน หรือสิทธิ์ไม่ใช่ ACTIVE -> ไปหน้าลงทะเบียน
          document.getElementById("register-screen").classList.remove("hidden");
        }

      } catch (err) {
        console.error("Fetch User Error:", err);
        showError("ไม่สามารถเชื่อมต่อฐานข้อมูลได้: " + err.message);
      }
    }

    // 4. บันทึกข้อมูลลงทะเบียนพนักงานใหม่
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกข้อมูล...";

      const payload = {
        action: "registerUser",
        line_user_id: document.getElementById("reg-line-id").value,
        emp_id: document.getElementById("reg-emp-id").value.trim(),
        full_name: document.getElementById("reg-full-name").value.trim(),
        department: document.getElementById("reg-dept").value,
        role: "STAFF" // กำหนด Role ตั้งต้นเป็น STAFF
      };

      try {
        const res = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === "success") {
          alert("ลงทะเบียนสำเร็จแล้ว!");
          location.reload(); // รีเฟรชเข้าสู่ระบบใหม่
        } else {
          alert("เกิดข้อผิดพลาด: " + data.message);
          btn.disabled = false;
          btn.innerText = "บันทึกข้อมูลลงทะเบียน";
        }
      } catch (err) {
        alert("ไม่สามารถบันทึกข้อมูลได้: " + err.message);
        btn.disabled = false;
        btn.innerText = "บันทึกข้อมูลลงทะเบียน";
      }
    }

    // UI Helpers
    function renderMainApp(lineProfile, userData) {
      document.getElementById("user-picture").src = lineProfile.pictureUrl || "https://via.placeholder.com/150";
      document.getElementById("user-name").innerText = userData.full_name;
      document.getElementById("user-dept").innerText = userData.department;
      document.getElementById("user-role").innerText = userData.role;
      document.getElementById("user-emp-id").innerText = userData.emp_id;

      document.getElementById("main-app").classList.remove("hidden");
    }

    function hideLoading() {
      document.getElementById("loading-screen").classList.add("hidden");
    }

    function showError(msg) {
      hideLoading();
      alert(msg);
    }
  </script>
</body>
</html>
